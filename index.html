<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><Shop-Hub></Shop-Hub></title>
    <link rel="stylesheet" href="./src/output.css">

</head>
<body class="bg-gray-100">

<!-- ================= NAVBAR ================= -->
<nav class="bg-blue-600 shadow">
    <div class="max-w-7xl mx-auto px-5">
        <div class="flex flex-col md:flex-row justify-between items-center py-4">

            <h1 class="text-white text-2xl font-bold">
                Shop-Hub
            </h1>

            <div class="flex gap-6 mt-4 md:mt-0">
                <a href="index.html" class="text-white hover:text-yellow-300">Home</a>
                <a href="customers.html" class="text-white hover:text-yellow-300">Customers</a>
                <a href="admin.html" class="text-white hover:text-yellow-300">Admin</a>
            </div>

        </div>
    </div>
</nav>

<!-- ================= HERO ================= -->

<section class="bg-white shadow">
    <div class="max-w-7xl mx-auto py-10 px-5 text-center">

        <h2 class="text-4xl font-bold">
            Discover Amazing Products
        </h2>

        <p class="text-gray-600 mt-3">
            Find the best Products at the best prices, Quality you can trust.
        </p>

    </div>
</section>

<!-- ================= SEARCH ================= -->

<div class="max-w-7xl mx-auto px-5 py-6">

    <div class="flex flex-col md:flex-row gap-4">

        <input
            id="searchInput"
            type="text"
            placeholder="Search products..."
            class="border rounded-lg p-3 w-full">

        <select
            id="categorySelect"
            class="border rounded-lg p-3 w-full md:w-64">

            <option value="">All Categories</option>

        </select>

    </div>

</div>

<!-- ================= PRODUCTS ================= -->

<div class="max-w-7xl mx-auto px-5">

    <div
        id="productGrid"
        class="grid
        grid-cols-1
        sm:grid-cols-2
        lg:grid-cols-3
        xl:grid-cols-4
        gap-6">

    </div>

</div>

<!-- ================= PAGINATION ================= -->

<div class="max-w-7xl mx-auto py-8">

    <div class="flex justify-center items-center gap-4 flex-wrap">

        <button
            id="prevBtn"
            class="bg-gray-300 px-5 py-2 rounded hover:bg-gray-400">
            Previous
        </button>

        <span
            id="pageNumber"
            class="font-bold text-lg">
            1
        </span>

        <button
            id="nextBtn"
            class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">
            Next
        </button>

    </div>

</div>

<!-- ================= MODAL ================= -->

<div
    id="modal"
    class="fixed inset-0 bg-black/50 hidden justify-center items-center p-4">

    <div
        class="bg-white rounded-xl w-full max-w-lg p-6 relative">

        <button
            id="closeModal"
            class="absolute right-4 top-4 text-2xl">
            ✕
        </button>

        <div id="modalContent"></div>

    </div>

</div>

<script>


</script>




    
    <script src="app.js"></script>
</body>
</html>
